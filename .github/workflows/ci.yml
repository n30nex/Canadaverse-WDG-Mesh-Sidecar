name: WDG Mesh Sidecar CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wdg-mesh-sidecar-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - run: python -m pytest -q

  firmware:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - environment: rcc6_wdg_mesh
            artifact: Canadaverse-WDG-Mesh-RCC6-app
          - environment: heltec_v3_wdg_mesh
            artifact: Canadaverse-WDG-Mesh-Heltec-V3-app
          - environment: heltec_v4_wdg_mesh
            artifact: Canadaverse-WDG-Mesh-Heltec-V4-app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Install pinned PlatformIO Core
        run: python -m pip install platformio==6.1.18
      - name: Build ${{ matrix.environment }}
        run: pio run -e ${{ matrix.environment }}
      - name: Package app image and checksum
        shell: bash
        run: |
          mkdir -p dist
          cp ".pio/build/${{ matrix.environment }}/firmware.bin" \
            "dist/${{ matrix.artifact }}.bin"
          cd dist
          sha256sum "${{ matrix.artifact }}.bin" > SHA256SUMS.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.artifact }}-${{ github.sha }}
          path: dist/*
          if-no-files-found: error

  required-service:
    name: required-service
    if: ${{ always() }}
    needs: [contract-tests, firmware]
    runs-on: ubuntu-latest
    steps:
      - name: Require contracts and every firmware target
        env:
          CONTRACT_RESULT: ${{ needs.contract-tests.result }}
          FIRMWARE_RESULT: ${{ needs.firmware.result }}
        run: |
          test "$CONTRACT_RESULT" = success
          test "$FIRMWARE_RESULT" = success
