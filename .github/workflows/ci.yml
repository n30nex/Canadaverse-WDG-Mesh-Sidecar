name: WDG Mesh Sidecar CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - run: python -m pytest -q

  firmware:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - environment: rcc6_wdg_mesh
            artifact: Canadaverse-WDG-Mesh-RCC6-app
          - environment: heltec_v3_wdg_mesh
            artifact: Canadaverse-WDG-Mesh-Heltec-V3-app
          - environment: heltec_v4_wdg_mesh
            artifact: Canadaverse-WDG-Mesh-Heltec-V4-app
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install pinned PlatformIO Core
        run: python -m pip install platformio==6.1.18
      - name: Build ${{ matrix.environment }}
        run: pio run -e ${{ matrix.environment }}
      - name: Package app image and checksum
        shell: bash
        run: |
          mkdir -p dist
          cp ".pio/build/${{ matrix.environment }}/firmware.bin" \
            "dist/${{ matrix.artifact }}.bin"
          cd dist
          sha256sum "${{ matrix.artifact }}.bin" > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
